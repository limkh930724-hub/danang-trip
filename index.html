/* ────────────────────────────────────────────────────────────
   색. 본문과 보조 텍스트를 모두 WCAG AAA(7:1 이상)로 맞췄다.
   밝은 야외에서 폰을 보는 상황을 기준으로 잡은 값이다.
   ──────────────────────────────────────────────────────────── */
:root{
  /* ── 낮: 안개 낀 숲 바닥. 바나힐 운해가 내려앉은 색 ── */
  --paper:#FBFBFA;
  --card:#FFFFFF;
  --ink:#12241A;
  --ink2:#384F42;
  --line:#D6D9D4;
  --line-soft:#E7E9E5;
  /* 구조: 옻칠 옥빛. 선택된 것, 누를 것 */
  --sea:#1B4B37;
  --on-sea:#F1F6EC;
  /* 숲 그늘. 헤더와 택시 화면이 쓴다 */
  --canopy-deep:#0F2B1C;
  --inset:rgba(20,24,22,.045);
  /* 종류별 색: 강물, 잎사귀, 옻칠, 나무껍질 */
  --ceramic:#1A4A5C;
  --jade:#1E5137;
  --roast:#7F3310;
  --clay:#5A4632;
  /* 황동빛. 잎 사이로 든 빛이자 옻칠의 금박. 지금 이 순간에만 쓴다 */
  --lantern:#6B4A05;
  --lantern-hi:#C99A26;
  --sun:#E8B93E;
  --sea-t:#E2EEF1;
  --jade-t:#E3EFE4;
  --lantern-t:#FBF2DA;
  --clay-t:#F0EAE0;
  /* 그림자는 초록을 머금은 회색. 숲 그늘의 색이다 */
  --shadow:0 0 0 1px rgba(22,26,24,.07), 0 1px 2px rgba(22,26,24,.045), 0 8px 20px rgba(22,26,24,.06);
  --shadow-lift:0 0 0 1px rgba(22,26,24,.07), 0 2px 6px rgba(22,26,24,.10), 0 14px 30px rgba(22,26,24,.11);
  /* 낮에는 카드에 테두리를 두지 않는다. 그림자와 면으로만 띄운다 */
  --card-edge:transparent;
  --tonal:#DCE9DF;
  --sea-deep:#143826;
  --fx-ico:rgba(255,255,255,.18);
  --r:18px;
  --r-s:12px;
  --tabh:68px;

  /* ── 밤: 같은 손트라, 해가 진 뒤. 아래 매핑이 골라 쓴다 ── */
  --d-paper:#101C16;
  --d-card:#1B2C22;
  --d-ink:#EAF2E7;
  --d-ink2:#A6BCAB;
  --d-line:#31463A;
  --d-line-soft:#26382E;
  --d-sea:#7FC9A4;
  --d-on-sea:#0A1F14;
  --d-canopy-deep:#101F16;
  --d-inset:rgba(255,255,255,.06);
  --d-ceramic:#79BDD0;
  --d-jade:#8FCB95;
  --d-roast:#F0A06A;
  --d-clay:#C6AC8A;
  --d-lantern:#E8B93E;
  --d-lantern-hi:#E8B93E;
  --d-sea-t:#102B33;
  --d-jade-t:#1B3624;
  --d-lantern-t:#2C210B;
  --d-clay-t:#302921;
  /* 밤에는 그림자가 안 보이므로 아주 얇은 선으로 면을 나눈다 */
  --d-card-edge:#2C4034;
  --d-tonal:#1E3125;
  --d-sea-deep:#4E9C79;
  --d-fx-ico:rgba(0,0,0,.16);
}

/* 어둡게는 직접 고른 경우에만. 기본은 밝은 쪽이다 */
:root[data-theme="dark"]{
    --paper:var(--d-paper);
    --card:var(--d-card);
    --ink:var(--d-ink);
    --ink2:var(--d-ink2);
    --line:var(--d-line);
    --line-soft:var(--d-line-soft);
    --sea:var(--d-sea);
    --on-sea:var(--d-on-sea);
    --canopy-deep:var(--d-canopy-deep);
    --inset:var(--d-inset);
    --ceramic:var(--d-ceramic);
    --jade:var(--d-jade);
    --roast:var(--d-roast);
    --clay:var(--d-clay);
    --lantern:var(--d-lantern);
    --lantern-hi:var(--d-lantern-hi);
    --sea-t:var(--d-sea-t);
    --jade-t:var(--d-jade-t);
    --lantern-t:var(--d-lantern-t);
    --clay-t:var(--d-clay-t);
    --card-edge:var(--d-card-edge);
    --tonal:var(--d-tonal);
    --sea-deep:var(--d-sea-deep);
    --fx-ico:var(--d-fx-ico);
    --shadow:none;
    --shadow-lift:none;
}

/* ── 기본 ── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  /* 한글 우선 시스템 폰트. 내려받는 폰트가 없어 즉시 뜬다 */
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:18px;
  line-height:1.6;
  /* 한글은 자간을 좁히면 읽기 어려워진다. 본문은 0으로 둔다 */
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
h1,h2,h3,p,ul,ol,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--lantern-hi);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ── 헤더 ── */
/* 헤더. 색 띠 대신 실제 다낭 사진을 깔고 그 위에 글자를 얹는다.
   여행 페이지는 여행처럼 보여야 한다. 사진은 바나힐 골든브릿지다. */
.hd{
  position:relative;
  overflow:hidden;
  color:#F4F8F0;
  padding:calc(env(safe-area-inset-top) + 26px) 20px 22px;
  background:var(--canopy-deep);
}
.hd::before{
  content:"";position:absolute;inset:0;
  background-image:var(--hero);
  background-size:cover;
  background-position:center 58%;
}
/* 글자가 앉을 아래쪽을 더 짙게. 사진은 질감으로만 남는다 */
.hd::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(176deg,
    rgba(9,24,16,.46) 0%,
    rgba(9,24,16,.74) 52%,
    rgba(9,24,16,.93) 100%);
}
.hd-inner{position:relative;z-index:1;max-width:620px;margin:0 auto}
.hd-eyebrow{
  font-size:11.5px;font-weight:700;
  letter-spacing:.22em;
  color:rgba(244,248,240,.66);
}
.hd-title{
  font-size:32px;font-weight:800;
  letter-spacing:-.025em;line-height:1.12;
  margin-top:7px;
}
.hd-meta{
  font-size:13.5px;margin-top:9px;
  color:rgba(244,248,240,.78);
}
.hd-clock{
  display:flex;gap:20px;align-items:baseline;
  margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(244,248,240,.20);
}
.hd-clock div{display:flex;align-items:baseline;gap:6px}
.hd-clock b{
  font-size:19px;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.hd-clock span{font-size:12px;color:rgba(244,248,240,.7);letter-spacing:.04em}

.themebtn{
  position:absolute;top:0;right:0;z-index:2;
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;color:#F4F8F0;
  background:rgba(9,24,16,.42);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.themebtn:active{background:rgba(9,24,16,.62)}
.themebtn svg{width:21px;height:21px}
.themebtn .i-moon{display:none}
.themebtn .i-sun{display:block}
:root[data-theme="dark"] .themebtn .i-moon{display:block}
:root[data-theme="dark"] .themebtn .i-sun{display:none}


/* ── 날짜 바 ── */
.daybar{
  position:sticky;top:0;z-index:25;
  background:var(--paper);
  box-shadow:0 1px 0 var(--line-soft);
  padding:6px 0 2px;
}
.daybar-scroll{
  display:flex;gap:12px;
  overflow-x:auto;
  padding:0 16px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.daybar-scroll::-webkit-scrollbar{display:none}
/* 날짜는 상자가 아니라 글자다. 고른 날 아래에만 황동빛 밑줄이 그어진다 */
.daychip{
  flex:none;scroll-snap-align:center;position:relative;
  min-width:70px;min-height:58px;
  padding:8px 6px 14px;
  text-align:center;line-height:1.3;
  color:var(--ink2);
}
.daychip b{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.01em}
.daychip span{display:block;font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums;opacity:.9}
.daychip[aria-current="true"]{color:var(--ink)}
.daychip[aria-current="true"] b{font-weight:800}
.daychip[aria-current="true"]::after{
  content:"";position:absolute;
  left:8px;right:8px;bottom:5px;height:3px;
  border-radius:3px;background:var(--sea);
}
.daychip.is-today b::after{
  content:"";display:inline-block;
  width:5px;height:5px;border-radius:50%;
  background:var(--lantern-hi);
  margin-left:5px;vertical-align:middle;
}

/* ── 본문 ── */
main{padding:0 16px}
.in{animation:rise .17s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ── 지금/다음 요약. 폰을 켜자마자 답이 보이게 하는 자리 ── */
.brief{
  margin:16px 0 4px;
  background:
    radial-gradient(120% 100% at 88% 0%, rgba(232,185,62,.18) 0%, rgba(232,185,62,0) 66%),
    var(--card);
  border:2px solid var(--sun);
  border-radius:var(--r);
  padding:16px 17px 17px;
  box-shadow:var(--shadow-lift);
}
.brief.is-wait{
  background:var(--card);
  border-color:var(--line);border-width:1.5px;
  box-shadow:var(--shadow);
}
.brief-eyebrow{
  font-size:13px;font-weight:800;letter-spacing:.02em;
  color:var(--lantern);
  font-variant-numeric:tabular-nums;
}
.brief.is-wait .brief-eyebrow{color:var(--sea)}
.brief-title{
  font-size:25px;font-weight:800;letter-spacing:-.015em;
  line-height:1.3;margin-top:3px;
}
.brief-sub{font-size:16px;color:var(--ink2);margin-top:5px;line-height:1.55}
.brief-next{
  margin-top:14px;padding-top:13px;
  border-top:1.5px dashed var(--line);
}
.brief-next-k{
  display:block;font-size:13px;font-weight:750;
  color:var(--ink2);font-variant-numeric:tabular-nums;
}
.brief-next-v{display:block;font-size:18.5px;font-weight:700;letter-spacing:-.01em;margin-top:2px}

/* ── 환율. 메인에는 한 줄짜리 버튼만 두고 실제 계산은 팝업에서 한다 ── */
/* 이 화면에서 유일하게 꽉 채운 면이다. 눌러야 하는 것은 이것 하나뿐이라는 뜻이다.
   아래쪽 단단한 그림자가 두께를 만들고, 누르면 그 두께만큼 실제로 내려간다. */
.fxbtn{
  display:flex;align-items:center;gap:12px;
  width:100%;min-height:58px;
  margin:14px 0 5px;padding:0 14px 0 12px;
  border-radius:15px;border:none;
  background:var(--sea);color:var(--on-sea);
  text-align:left;
  box-shadow:0 3px 0 var(--sea-deep), 0 5px 14px rgba(22,26,24,.20);
  transition:transform .06s ease, box-shadow .06s ease;
}
.fxbtn:active{
  transform:translateY(3px);
  box-shadow:0 0 0 var(--sea-deep), 0 2px 6px rgba(22,26,24,.16);
}
.fxbtn-ico{
  flex:none;width:34px;height:34px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:var(--fx-ico);
  font-size:18px;font-weight:800;
}
.fxbtn-label{flex:none;font-size:16.5px;font-weight:750}
.fxbtn-hint{
  flex:1;text-align:right;
  font-size:14px;font-weight:650;opacity:.82;
  font-variant-numeric:tabular-nums;
}
.fxbtn-go{
  flex:none;width:9px;height:9px;
  border-right:2.5px solid currentColor;
  border-top:2.5px solid currentColor;
  transform:rotate(45deg);
  opacity:.7;margin-left:2px;
}

/* 아래에서 올라오는 팝업. 엄지가 닿는 자리에 버튼이 모인다 */
.modal{
  position:fixed;inset:0;z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal[hidden]{display:none}
.modal-back{position:absolute;inset:0;background:rgba(12,20,15,.55)}
.modal-card{
  position:relative;width:100%;max-width:520px;
  background:var(--card);
  border-radius:24px 24px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 44px rgba(0,0,0,.28);
  animation:sheetUp .22s ease-out;
}
@keyframes sheetUp{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.modal-grip{
  width:40px;height:4px;border-radius:99px;
  background:var(--line);margin:0 auto 14px;
}
.modal-title{font-size:19px;font-weight:750;letter-spacing:-.02em;margin-bottom:14px}

.fx-in{
  display:flex;align-items:center;gap:9px;
  background:var(--inset);border-radius:14px;
  padding:0 15px;min-height:56px;
}
.fx-in:focus-within{box-shadow:0 0 0 2px var(--sea)}
.fx-unit{flex:none;font-size:20px;font-weight:700;color:var(--ink2)}
#fxInput{
  flex:1;min-width:0;width:100%;
  border:none;background:none;outline:none;padding:0;
  font-family:inherit;font-size:24px;font-weight:750;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.fx-eq{
  display:flex;align-items:baseline;justify-content:center;gap:6px;
  padding:18px 0 16px;color:var(--sea);
}
.fx-eq b{
  font-size:40px;font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.fx-eq span{font-size:19px;font-weight:750}
.fx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.fx-chip{
  min-height:54px;border-radius:13px;border:none;
  background:var(--tonal);color:var(--sea);
  font-size:16.5px;font-weight:750;
  font-variant-numeric:tabular-nums;
}
.fx-chip[aria-current="true"]{background:var(--sea);color:var(--on-sea)}
.fx-chip:active{filter:brightness(.94)}
.fx-note{margin-top:13px;font-size:13px;line-height:1.55;color:var(--ink2)}
.fx-done{
  width:100%;min-height:54px;margin-top:16px;
  border-radius:14px;border:none;
  background:var(--sea);color:var(--on-sea);
  font-size:17px;font-weight:750;
}
.fx-done:active{filter:brightness(1.08)}

/* ── 날짜 제목 ── */
.day-head{padding:22px 2px 14px}
.day-head h2{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.day-head p{font-size:15px;color:var(--ink2);margin-top:5px}

/* ── 타임라인 ──
   좁은 화면에서 글자 폭을 확보하려고 시각을 카드 안으로 옮겼다.
   왼쪽에는 얇은 레일과 점만 남는다. */
.tl{position:relative;padding-bottom:10px}
.tl::before{
  content:"";position:absolute;
  left:9px;top:16px;bottom:30px;width:2px;
  background:var(--line);border-radius:2px;
}
.ti{
  display:grid;grid-template-columns:26px 1fr;
  align-items:start;margin-bottom:15px;
}
.ti-rail{position:relative;align-self:stretch}
.ti-rail::before{
  content:"";position:absolute;
  left:2px;top:19px;
  width:16px;height:16px;border-radius:50%;
  background:var(--sea);
  box-shadow:0 0 0 4px var(--paper);
}
.ti-card{
  background:var(--card);
  border:1px solid var(--card-edge);
  border-radius:var(--r);
  padding:15px 16px 16px;
  box-shadow:var(--shadow);
}
.ti-top{
  display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;
  margin-bottom:3px;
}
.ti-time{
  font-size:22px;font-weight:800;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
}
.ti-next{
  display:block;font-size:12px;font-weight:800;
  color:var(--lantern);letter-spacing:.02em;
}
.ti-card h3{font-size:21px;font-weight:700;letter-spacing:-.012em;line-height:1.35}
.ti-vi{font-size:15px;color:var(--ink2);margin-top:3px}
.ti-note{
  font-size:16px;color:var(--ink2);
  margin-top:9px;padding-top:9px;
  border-top:1px solid var(--line-soft);
  line-height:1.55;
}
.chip{
  flex:none;
  font-size:13px;font-weight:800;letter-spacing:.02em;
  padding:4px 11px;border-radius:999px;
  white-space:nowrap;
}

/* 종류별 색. 점 색과 칩 색이 같아서 훑을 때 짝이 맞는다 */
.ti[data-kind="이동"] .ti-rail::before{background:var(--ceramic)}
.ti[data-kind="이동"] .chip{background:var(--sea-t);color:var(--ceramic)}
.ti[data-kind="관광"] .ti-rail::before{background:var(--jade)}
.ti[data-kind="관광"] .chip{background:var(--jade-t);color:var(--jade)}
.ti[data-kind="식사"] .ti-rail::before{background:var(--roast)}
.ti[data-kind="식사"] .chip{background:#FCEDE4;color:var(--roast)}
.ti[data-kind="휴식"] .ti-rail::before,
.ti[data-kind="숙소"] .ti-rail::before{background:var(--clay)}
.ti[data-kind="휴식"] .chip,
.ti[data-kind="숙소"] .chip{background:var(--clay-t);color:var(--clay)}

/* 지난 일정은 물러나고, 진행 중인 하나만 앞으로 나온다 */
.ti.is-past{opacity:.55}
.ti.is-now .ti-card{
  border-color:var(--sun);
  border-width:2.5px;
  background:var(--lantern-t);
  box-shadow:var(--shadow-lift);
}
.ti.is-now .ti-rail::before{
  background:var(--lantern-hi);
  width:18px;height:18px;left:1px;
  box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--lantern-t);
}
.ti.is-now .ti-time{color:var(--lantern)}

/* 현재 시각 선 */
.nowline{display:flex;align-items:center;gap:9px;margin:2px 0 16px}
.nowline-tag{
  flex:none;
  font-size:12.5px;font-weight:800;
  color:#12241A;background:var(--sun);
  padding:4px 12px;border-radius:999px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 2px 8px rgba(201,154,38,.45);
}
.nowline-rule{
  flex:1;height:3px;border-radius:2px;
  background:linear-gradient(90deg, var(--sun), rgba(232,185,62,0));
}

/* ── 사진 ── */
.shot{
  margin:-14px -16px 12px;
  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;
  overflow:hidden;background:var(--line);
}
.card .shot{margin:-16px -17px 14px}
.shot img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
/* 장소 탭 안의 하위 탭 */
.seg{
  display:flex;gap:8px;
  margin:16px 0 2px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.segbtn{
  flex:1 0 auto;min-height:46px;padding:0 18px;
  border-radius:var(--r-s);
  border:none;
  background:var(--tonal);
  color:var(--sea);
  font-size:15.5px;font-weight:700;
  white-space:nowrap;
}
.segbtn[aria-current="true"]{background:var(--sea);color:var(--on-sea)}
.segbtn:active{filter:brightness(.94)}

/* 관광지 썸네일. 글줄 옆에 붙어 세로 자리를 거의 안 먹는다 */
.ti-body,.pl-body{display:flex;gap:13px;align-items:flex-start}
.ti-body > .ti-text,.pl-body > .pl-text{flex:1;min-width:0}
.thumb{
  flex:none;width:76px;height:76px;
  border-radius:12px;object-fit:cover;
  border:1px solid var(--line);
  background:var(--line-soft);
}
/* 사진 출처. CC 라이선스는 저작자 표기를 요구하므로 지울 수는 없다.
   대신 접어두어 평소에는 한 줄만 보이게 한다. */
.credits{
  margin-top:18px;padding-top:14px;
  border-top:1px solid var(--line-soft);
  text-align:left;
}
.credits summary{
  list-style:none;cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--ink2);opacity:.75;
  padding:4px 0;
}
.credits summary::-webkit-details-marker{display:none}
.credits summary::after{content:" +";font-weight:800}
.credits[open] summary::after{content:" −"}
.credits-body{
  font-size:11.5px;line-height:1.7;
  color:var(--ink2);opacity:.85;
  padding-top:6px;
}
.shot figcaption{
  padding:7px 12px 8px;
  font-size:12px;line-height:1.45;
  color:var(--ink2);background:var(--paper);
}

/* ── 버튼 ── */
.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  min-height:46px;padding:0 17px;
  border-radius:var(--r-s);
  border:none;
  background:var(--tonal);
  color:var(--sea);
  font-size:15.5px;font-weight:700;
  text-decoration:none;
}
.btn:active{filter:brightness(.94);transform:scale(.985)}
.btn-solid{background:var(--sea);color:var(--on-sea)}
.btn svg{width:18px;height:18px;flex:none}

/* ── 카드 공통 ── */
.sec-head{
  padding:24px 2px 11px;
  font-size:13.5px;font-weight:800;letter-spacing:.09em;
  color:var(--ink2);
}
.card{
  background:var(--card);
  border:1px solid var(--card-edge);
  border-radius:var(--r);
  padding:16px 17px 17px;
  margin-bottom:13px;
  box-shadow:var(--shadow);
}
.card h3{font-size:21px;font-weight:750;letter-spacing:-.015em;line-height:1.3}
.card-vi{font-size:15px;color:var(--ink2);margin-top:3px}

/* 예약 정보 줄 */
.kv{margin-top:13px;border-top:1px solid var(--line-soft)}
.kv-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line-soft);
}
.kv-row:last-child{border-bottom:none}
.kv-k{flex:none;width:78px;font-size:14px;color:var(--ink2);font-weight:700}
.kv-v{flex:1;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;word-break:break-word;line-height:1.45}
.kv-copy{
  flex:none;min-height:40px;padding:0 13px;
  border-radius:10px;background:var(--tonal);color:var(--sea);
  font-size:14px;font-weight:800;text-decoration:none;
  display:inline-flex;align-items:center;
}
.kv-copy:active{opacity:.65}

.addr{
  margin-top:12px;padding:12px 14px;
  background:var(--inset);border-radius:11px;
  font-size:15.5px;line-height:1.5;
}
.tipline{margin-top:11px;font-size:15.5px;color:var(--ink2);line-height:1.55}

/* ── 준비물 ── */
.prog{
  background:var(--card);border:1px solid var(--card-edge);
  border-radius:var(--r);padding:16px 17px;margin:18px 0 6px;
  box-shadow:var(--shadow);
}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-top b{font-size:19px;font-weight:750;letter-spacing:-.015em}
.prog-top span{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.prog-bar{height:11px;border-radius:99px;background:var(--line);overflow:hidden}
.prog-fill{height:100%;background:var(--sea);border-radius:99px;transition:width .3s ease}
.chk{
  display:flex;align-items:flex-start;gap:13px;
  width:100%;text-align:left;
  padding:14px 4px;
  border-bottom:1px solid var(--line-soft);
}
.chk:last-child{border-bottom:none}
.chk-box{
  flex:none;width:29px;height:29px;margin-top:1px;
  border:2px solid var(--line);border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.chk-box svg{width:18px;height:18px;opacity:0;color:#fff}
.chk-txt{flex:1;font-size:18px;line-height:1.5}
.chk[aria-pressed="true"] .chk-box{background:var(--sea);border-color:var(--sea)}
.chk[aria-pressed="true"] .chk-box svg{opacity:1;color:var(--on-sea)}
.chk[aria-pressed="true"] .chk-txt{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:2px}

.facts{list-style:none;padding:0}
.facts li{
  padding:12px 0;border-bottom:1px solid var(--line-soft);
  font-size:16.5px;line-height:1.55;
}
.facts li:last-child{border-bottom:none}
.facts b{font-weight:750}
.phrase{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.phrase span{color:var(--ink2);font-size:15.5px;flex:none;text-align:right}

/* ── 하단 탭 ── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  height:var(--tabh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink2);
}
.tab svg{width:25px;height:25px}
.tab span{font-size:12.5px;font-weight:750}
.tab[aria-current="true"]{color:var(--sea)}
.tab[aria-current="true"] span{font-weight:800}

/* ── 주소 전체화면 ── */
.sheet{
  position:fixed;inset:0;z-index:60;
  background:
    radial-gradient(100% 70% at 50% 0%, rgba(232,185,62,.16) 0%, rgba(232,185,62,0) 70%),
    var(--canopy-deep);
  color:#F1F6EC;
  display:flex;flex-direction:column;justify-content:center;
  padding:28px 24px calc(28px + env(safe-area-inset-bottom));
  text-align:center;
}
.sheet[hidden]{display:none}
.sheet-eyebrow{font-size:13.5px;letter-spacing:.1em;opacity:.8;margin-bottom:20px}
.sheet-name{font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sheet-addr{font-size:24px;line-height:1.45;margin-top:18px;font-weight:600}
.sheet-hint{margin-top:34px;font-size:15px;opacity:.75;line-height:1.5}
.sheet-close{
  margin-top:28px;align-self:center;
  min-height:52px;padding:0 30px;border-radius:13px;
  background:rgba(241,246,236,.16);border:1px solid rgba(241,246,236,.28);
  font-size:17px;font-weight:750;
}

/* ── 토스트 ── */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  z-index:70;
  background:var(--ink);color:var(--paper);
  padding:13px 20px;border-radius:999px;
  font-size:15.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1}

footer{padding:28px 4px 22px;font-size:13.5px;color:var(--ink2);text-align:center;line-height:1.65}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
  .btn:active{transform:none}
}
@media (min-width:640px){
  body{font-size:19px}
  main,.daybar-scroll{max-width:640px;margin-left:auto;margin-right:auto}
}
</style>
</head>

/* ============================================================
   여기부터는 화면 그리는 코드. 보통은 고칠 일이 없습니다.
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);

/* --- 시간 --- */
function tzNow(tz){
  const p = {};
  for (const x of new Intl.DateTimeFormat("en-US", {
    timeZone: tz, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date())) p[x.type] = x.value;
  const hh = p.hour === "24" ? "00" : p.hour;
  return { date: `${p.year}-${p.month}-${p.day}`, time: `${hh}:${p.minute}` };
}
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const dayDiff = (a, b) => Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
const fmtMD = iso => { const [, m, d] = iso.split("-"); return `${+m}/${+d}`; };
const fmtLong = iso => {
  const [, m, d] = iso.split("-");
  const day = TRIP.days.find(x => x.date === iso);
  return `${+m}월 ${+d}일${day ? ` ${day.dow}요일` : ""}`;
};

/* --- 밝게 / 어둡게 ---
   기본은 밝은 쪽이다. 기기가 다크 모드여도 밝게 시작한다.
   헤더 버튼으로 바꾸면 그 선택이 폰에 남는다. */
const THEME_KEY = "danang.theme.v1";

function currentTheme(){
  /* 기기가 어두운 설정이어도 밝은 쪽으로 시작한다.
     어둡게는 사용자가 직접 고른 경우에만 남는다. */
  return document.documentElement.getAttribute("data-theme") || "light";
}
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  /* 안드로이드 크롬 주소창 색도 같이 맞춘다 */
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.remove();
  const meta = document.createElement("meta");
  meta.name = "theme-color";
  meta.content = mode === "dark" ? "#101F16" : "#173A28";
  document.head.appendChild(meta);
  const btn = $("#themebtn");
  if (btn) btn.setAttribute("aria-label", mode === "dark" ? "밝게 바꾸기" : "어둡게 바꾸기");
}

/* --- 토스트 --- */
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1900);
}

/* --- 복사 --- */
async function copyText(text, label){
  const done = () => toast(`${label} 복사했어요`);
  try {
    await navigator.clipboard.writeText(text);
    return done();
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  ok ? done() : toast("복사가 안 돼요. 글자를 길게 눌러 복사하세요");
}

/* --- 환율 어림셈 ---
   실시간 환율을 부르지 않는다. 오프라인에서도 열려야 하고,
   현지에서 필요한 것은 소수점이 아니라 "대충 얼마인지"이기 때문이다.
   1,000동을 55원으로 잡는다. 0 세 개 빼고 55 곱하는 그 셈이다. */
const FX_PER_1000 = 55;
const FX_PRESETS = [10000, 50000, 100000, 200000, 500000, 1000000];
let fxVnd = 100000;

const fxFmt = n => n.toLocaleString("ko-KR");
const fxWon = vnd => Math.round(vnd / 1000 * FX_PER_1000);
const fxLabel = v => (v >= 10000 ? v / 10000 + "만" : fxFmt(v));

/* 입력 중에는 결과 숫자만 바꾼다. 통째로 다시 그리면 커서가 튄다 */
function fxSet(vnd, syncInput){
  fxVnd = Math.max(0, Math.min(vnd, 999999999));
  const out = $("#fxOut");
  if (out) out.textContent = fxFmt(fxWon(fxVnd));
  if (syncInput) {
    const el = $("#fxInput");
    if (el) el.value = fxFmt(fxVnd);
  }
  for (const b of document.querySelectorAll("[data-fx]")) {
    b.setAttribute("aria-current", String(+b.dataset.fx === fxVnd));
  }
}

/* 남은 시간을 사람이 읽는 말로 */
function untilText(mins){
  if (mins <= 0) return "곧";
  if (mins < 60) return `${mins}분 뒤`;
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}시간 ${m}분 뒤` : `${h}시간 뒤`;
}

/* 폰을 켜자마자 "지금 뭐 할 차례지"에 답하는 자리.
   여행 중이면 진행 중인 일정과 다음 일정, 아니면 출발 안내를 보여준다. */
function renderBrief(){
  const now = tzNow("Asia/Ho_Chi_Minh");
  const days = TRIP.days;
  const idx = days.findIndex(d => d.date === now.date);
  const box = $("#brief");

  if (idx < 0) {
    const first = days[0], it = first.items[0];
    const left = dayDiff(now.date, first.date);
    const head = left > 0 ? `출발까지 ${left}일` : "여행이 끝났습니다";
    box.innerHTML = `
      <section class="brief is-wait">
        <p class="brief-eyebrow">${esc(head)}</p>
        <p class="brief-title">${esc(fmtLong(first.date))} ${esc(it.time)}</p>
        <p class="brief-sub">${esc(it.title)}</p>
      </section>`;
    return;
  }

  const d = days[idx], nowMin = toMin(now.time);
  const mins = d.items.map(it => toMin(it.time) + (it.nextDay ? 1440 : 0));
  let nextIdx = mins.findIndex(m => m > nowMin);
  if (nextIdx === -1) nextIdx = d.items.length;
  const cur = nextIdx > 0 ? d.items[nextIdx - 1] : null;
  const nxt = d.items[nextIdx];

  box.innerHTML = `
    <section class="brief">
      <p class="brief-eyebrow">지금 ${esc(now.time)} · 여행 ${idx + 1}일차</p>
      <p class="brief-title">${esc(cur ? cur.title : "오늘 일정 시작 전")}</p>
      <p class="brief-sub">${esc(cur ? (cur.note || cur.vi || d.theme) : `첫 일정은 ${d.items[0].time}입니다`)}</p>
      ${nxt ? `<div class="brief-next">
        <span class="brief-next-k">다음 ${esc(nxt.time)} · ${esc(untilText(mins[nextIdx] - nowMin))}</span>
        <span class="brief-next-v">${esc(nxt.title)}</span>
      </div>` : `<div class="brief-next"><span class="brief-next-k">오늘 일정은 여기까지입니다</span></div>`}
    </section>`;
}

    const cls = isToday ? (i === curIdx ? " is-now" : (i < curIdx ? " is-past" : "")) : "";
    rows.push(`
      <div class="ti${cls}" data-kind="${esc(it.kind)}">
        <div class="ti-rail"></div>
        <div class="ti-card">
          ${shot(it.photo)}
          <div class="ti-top">
            <span class="ti-time">${esc(it.time)}${it.nextDay ? '<span class="ti-next">다음날</span>' : ""}</span>
            <span class="chip">${esc(it.kind)}</span>
          </div>
          <div class="ti-body">
            <div class="ti-text">
              <h3>${esc(it.title)}</h3>
              ${it.vi ? `<p class="ti-vi">${esc(it.vi)}</p>` : ""}
            </div>
            ${thumb(it.thumb)}
          </div>
          ${it.note ? `<p class="ti-note">${esc(it.note)}</p>` : ""}
          ${it.map ? `<div class="acts"><a class="btn" href="${esc(mapUrl(it.map))}" target="_blank" rel="noopener">${pinSvg()}지도에서 보기</a></div>` : ""}
        </div>
      </div>`);
  });
  if (isToday && nowIdx === d.items.length) rows.push(nowRow(now.time));

  $("#timeline").innerHTML = rows.join("");
}
const nowRow = t => `<div class="nowline"><span class="nowline-tag">지금 ${esc(t)}</span><span class="nowline-rule"></span></div>`;

/* 76px 정사각 썸네일. "어떤 곳인지"만 알면 되는 자리에 쓴다 */
function thumb(key){
  const p = key && PHOTOS[key];
  if (!p) return "";
  return `<img class="thumb" src="${p.src}" alt="${esc(p.alt)}" loading="lazy" decoding="async" width="76" height="76">`;
}

/* 사진 출처. CC 라이선스는 저작자 표기를 요구하므로 맨 아래에 모아 적는다 */
function creditList(){
  const seen = new Map();
  for (const p of Object.values(PHOTOS)) {
    const k = p.by + " / " + p.lic;
    if (!seen.has(k)) seen.set(k, []);
    seen.get(k).push(p.alt);
  }
  return [...seen.entries()]
    .map(([who, what]) => `${esc(what.join(", "))} · ${esc(who)}`)
    .join("<br>");
}

/* 사진 한 장. PHOTOS에 없는 키면 아무것도 그리지 않는다 */
function shot(key){
  const p = key && PHOTOS[key];
  if (!p) return "";
  return `<figure class="shot">
    <img src="${p.src}" alt="${esc(p.alt)}" loading="lazy" decoding="async" width="560" height="373">
    <figcaption>사진 ${esc(p.by)} · ${esc(p.license)}</figcaption>
  </figure>`;
}
const pinSvg = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7-6.6 7-11.5a7 7 0 1 0-14 0c0 4.9 7 11.5 7 11.5z"/><circle cx="12" cy="10" r="2.6"/></svg>`;
const copySvg = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V6"/></svg>`;

/* --- 예약 --- */
function renderBookings(){
  const cards = TRIP.bookings.map(b => `
    <div class="card">
      ${shot(b.photo)}
      <span class="chip" style="background:var(--sea-t);color:var(--sea)">${esc(b.type)}</span>
      <h3>${esc(b.title)}</h3>
      ${b.sub ? `<p class="card-vi">${esc(b.sub)}</p>` : ""}
      <div class="kv">
        ${b.rows.map(([k, v, copy]) => `
          <div class="kv-row">
            <span class="kv-k">${esc(k)}</span>
            <span class="kv-v">${esc(v)}</span>
            ${copy ? `<button class="kv-copy" data-copy="${esc(v)}" data-label="${esc(k)}">복사</button>` : ""}
          </div>`).join("")}
      </div>
      ${b.addr ? `<div class="addr">${esc(b.addr)}</div>
        <div class="acts">
          <a class="btn" href="${esc(mapUrl(b.addr))}" target="_blank" rel="noopener">${pinSvg()}지도</a>
          <button class="btn" data-copy="${esc(b.addr)}" data-label="주소">${copySvg()}주소 복사</button>
        </div>` : ""}
      ${b.tip ? `<p class="tipline">${esc(b.tip)}</p>` : ""}
    </div>`).join("");

  const emg = `
    <div class="sec-head">문제가 생기면</div>
    <div class="card">
      <div class="kv" style="margin-top:0;border-top:none">
        ${TRIP.emergency.map(([k, v]) => `
          <div class="kv-row">
            <span class="kv-k" style="width:auto;flex:1">${esc(k)}</span>
            <a class="kv-copy" href="tel:${esc(v.replace(/[^+\d]/g, ""))}">${esc(v)}</a>
          </div>`).join("")}
      </div>
      <p class="tipline">여권을 잃어버리면 총영사관에서 여행증명서를 받아 귀국할 수 있습니다.</p>
    </div>`;

  const notice = `<p class="tipline" style="padding:0 4px 10px">이 페이지는 주소만 알면 누구나 열 수 있어서 예약번호는 뒷자리만 적어뒀습니다. 전체 번호는 가족 단톡방 공지를 봐주세요.</p>`;

  $("#tab-book").innerHTML = `<div class="sec-head">예약 확인</div>${notice}${cards}${emg}`;
}

/* --- 장소 --- */
function renderPlaces(){
  const groups = TRIP.placeGroups;
  const g = groups[state.placeTab] || groups[0];

  const seg = `<div class="seg" role="tablist">${groups.map((x, i) =>
    `<button class="segbtn" role="tab" data-seg="${i}" aria-current="${i === state.placeTab}">${esc(x.key)}</button>`
  ).join("")}</div>`;

  const cards = g.items.map(p => `
    ${p.head ? `<div class="sec-head">${esc(p.head)}</div>` : ""}
    <div class="card">
      ${shot(p.photo)}
      <div class="pl-body">
        <div class="pl-text">
          <h3>${esc(p.ko)}</h3>
          <p class="card-vi">${esc(p.vi)}</p>
        </div>
        ${thumb(p.thumb)}
      </div>
      <div class="addr">${esc(p.addr)}</div>
      <div class="acts">
        <a class="btn btn-solid" href="${esc(mapUrl(p.vi + ", " + p.addr))}" target="_blank" rel="noopener">${pinSvg()}지도</a>
        <button class="btn" data-sheet="1" data-name="${esc(p.vi)}" data-addr="${esc(p.addr)}">기사님께 보여주기</button>
        <button class="btn" data-copy="${esc(p.vi + ", " + p.addr)}" data-label="주소">${copySvg()}복사</button>
      </div>
      ${p.tip ? `<p class="tipline">${esc(p.tip)}</p>` : ""}
    </div>`).join("");

  const foot = state.placeTab === 2
    ? '<p class="tipline" style="padding:6px 4px 0">평점과 영업시간은 자주 바뀝니다. 가기 전에 지도 버튼으로 한 번 확인하세요.</p>'
    : '<p class="tipline" style="padding:6px 4px 0">주소를 크게 띄워 택시 기사에게 보여주세요. 화면 밝기를 올리면 잘 보입니다.</p>';

  $("#tab-place").innerHTML = seg + cards + foot;
}

/* --- 준비물 --- */
function renderPrep(){
  const all = TRIP.checklist.flatMap(g => g.items);
  const done = all.filter(t => checked.has(t)).length;
  const pct = all.length ? Math.round(done / all.length * 100) : 0;

  const groups = TRIP.checklist.map(g => `
    <div class="sec-head">${esc(g.name)}</div>
    <div class="card" style="padding:4px 14px">
      ${g.items.map(t => `
        <button class="chk" data-check="${esc(t)}" aria-pressed="${checked.has(t)}">
          <span class="chk-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="chk-txt">${esc(t)}</span>
        </button>`).join("")}
    </div>`).join("");

  const facts = `
    <div class="sec-head">알아두면 편한 것</div>
    <div class="card">
      <ul class="facts">
        ${TRIP.facts.map(([k, v]) => `<li><b>${esc(k)}</b> · ${v}</li>`).join("")}
      </ul>
    </div>
    <div class="sec-head">한마디 베트남어</div>
    <div class="card">
      <ul class="facts">
        ${TRIP.phrases.map(([vi, ko]) => `<li class="phrase"><b>${esc(vi)}</b><span>${esc(ko)}</span></li>`).join("")}
      </ul>
    </div>`;

  $("#tab-prep").innerHTML = `
    <div class="prog">
      <div class="prog-top"><b>짐 싸기</b><span class="num">${done} / ${all.length} 완료</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    ${groups}${facts}`;
}

/* --- 탭 --- */
function setTab(name){
  state.tab = name;
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-current", String(b.dataset.tab === name));
  for (const id of ["plan", "book", "place", "prep"]) $("#tab-" + id).hidden = id !== name;
  const pane = $("#tab-" + name);
  pane.classList.remove("in"); void pane.offsetWidth; pane.classList.add("in");
  $("#daybar").hidden = name !== "plan";
  window.scrollTo(0, 0);
}

/* --- 이벤트 --- */
document.addEventListener("click", e => {
  if (e.target.closest("#themebtn")) {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    toast(next === "dark" ? "어둡게" : "밝게");
    return;
  }

  const tab = e.target.closest(".tab");
  if (tab) return setTab(tab.dataset.tab);

  const chip = e.target.closest(".daychip");
  if (chip) {
    state.day = +chip.dataset.day;
    renderDaybar();
    renderTimeline();
    chip.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    return;
  }

  if (e.target.closest("#fxOpen")) { fxOpen(); return; }
  if (e.target.closest("#fxClose") || e.target.classList.contains("modal-back")) {
    $("#fxModal").hidden = true;
    return;
  }

  const fx = e.target.closest("[data-fx]");
  if (fx) { fxSet(+fx.dataset.fx, true); return; }

  const seg = e.target.closest("[data-seg]");
  if (seg) {
    state.placeTab = +seg.dataset.seg;
    renderPlaces();
    window.scrollTo(0, 0);
    return;
  }

  const cp = e.target.closest("[data-copy]");
  if (cp) return copyText(cp.dataset.copy, cp.dataset.label || "");

  const sh = e.target.closest("[data-sheet]");
  if (sh) {
    $("#sheetName").textContent = sh.dataset.name;
    $("#sheetAddr").textContent = sh.dataset.addr;
    $("#sheet").hidden = false;
    $("#sheetClose").focus();
    return;
  }
  if (e.target.closest("#sheetClose") || e.target.id === "sheet") {
    $("#sheet").hidden = true;
    return;
  }

  const ck = e.target.closest("[data-check]");
  if (ck) {
    const key = ck.dataset.check;
    checked.has(key) ? checked.delete(key) : checked.add(key);
    saveChecked();
    const y = window.scrollY;
    renderPrep();
    window.scrollTo(0, y);
  }
});

document.addEventListener("input", e => {
  if (e.target && e.target.id === "fxInput") {
    fxSet(+String(e.target.value).replace(/[^0-9]/g, "") || 0, false);
  }
});

/* 입력을 마치면 자릿수 쉼표를 다시 넣어준다 */
document.addEventListener("blur", e => {
  if (e.target && e.target.id === "fxInput") fxSet(fxVnd, true);
}, true);

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#fxModal").hidden) { $("#fxModal").hidden = true; return; }
  if (!$("#sheet").hidden) $("#sheet").hidden = true;
});

/* --- 시작 --- */
function boot(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark" || saved === "light") applyTheme(saved);
  } catch (e) {}

  renderHeader();
  const now = tickClock();
  const idx = TRIP.days.findIndex(d => d.date === now.date);
  state.day = idx >= 0 ? idx : 0;

  renderBrief();
  renderFxBar();
  renderDaybar();
  renderTimeline();
  renderBookings();
  renderPlaces();
  renderPrep();
  setTab("plan");

  $("#foot").innerHTML = `${esc(TRIP.title)} · 이 페이지는 인터넷 없이도 열립니다<br>지도 버튼만 인터넷이 필요해요
    <details class="credits"><summary>사진 출처</summary><div class="credits-body">위키미디어 커먼즈<br>${creditList()}</div></details>`;

  const chip = document.querySelector('.daychip[aria-current="true"]');
  if (chip) chip.scrollIntoView({ inline: "center", block: "nearest" });

  setInterval(() => {
    tickClock();
    if (state.tab === "plan") { renderBrief(); renderTimeline(); }
  }, 60000);
}
boot();
</script>
</body>
</html>
